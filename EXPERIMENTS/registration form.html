<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

<center> <h2>Student Registration Form</h2></center>
<fieldset>
    <legend> Registration Form </legend>
<form action="#">

<label for="fullname">Full Name:</label>
    <input type="text" name=" fullname" placeholder="Enter your name" required>
    <br><br>
<label for="email">Email:</label>
    <input type="email" name="email" placeholder="Enter your email" required>
    <br><br>
<label for="password">Password:</label>
    <input type="password" name="password" placeholder="Enter password" required>
    <br><br>
    <label for=" Gender">Gender</label>
    <input type="radio" name="gender" id="gender"> <label for="gender" >Male</label>
    <input type="radio" name="gender" id="gender"> <label for="gender" >Female</label>
    <br><br>
<label for="course">Course:</label>
    <input type="text" name="course" placeholder="Enter course name" required>
    <br><br>
<label for="phone">Phone no.:</label>
    <input type="tel" name="phone no." placeholder="Enter phone number" required>
    <br><br>
    <label for="address">Address:</label>
    <input type="text" name="address" required><br><br>
    <input type="submit" value="Register">
    <input type="reset" value="Clear">

</form>
</fieldset>

</body>
</html>

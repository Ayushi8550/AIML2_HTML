<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend> HOTEL ROOM BOOKING FORM</legend>
        <form action="./response.html" name="" target="" method="GET" >
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name">
            <br></br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Enter your email">
            <br></br>
            <label for="check in data">check in data:</label>
            <input type="date" name="check in data" id="check in data"><br></br>
            <br></br>
            <label for="check out data">check out data:</label>
            <input type="date" name="check out data" id="check out data"><br></br>
            <br></br>
            <label for="room type">Room Type</label>
            <select name="room type" id="room type">
                <option value="single">Single</option>
                <option value="double">Double</option>
                <option value="suite">Suite</option>
            </select>
            <br><br>
            <label for="number of guest">number of guests:</label>
            <input type="number" name="number of guest" id="number of guest" min="1" max="10">
            <br><br>
                <input type="submit" name="submit" id="submit" value="Book Now">
                <input type="reset" name="reset" id="reset" value="Reset">
        </form>
    </fieldset>
    
</body>
</html>
